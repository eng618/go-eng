version: "3"

tasks:
  run:
    desc: Run generics module
    cmds:
      - env -u GOROOT -u GOTOOLDIR go run main.go

  build:
    desc: Build generics module
    cmds:
      - env -u GOROOT -u GOTOOLDIR go build -v ./...

  lint:
    desc: Run linter for generics module
    cmds:
      - env -u GOROOT -u GOTOOLDIR golangci-lint run ./...

  lint-fix:
    desc: Fix linting issues for generics module
    cmds:
      - env -u GOROOT -u GOTOOLDIR golangci-lint run --fix ./...

  test:
    desc: Run tests for generics module
    cmds:
      - CGO_ENABLED=1 env -u GOROOT -u GOTOOLDIR go test ./... -cover -race -coverprofile=coverage.out -covermode=atomic

  bench:
    desc: Run benchmarks for generics module
    cmds:
      - echo "TODO add benchmarks"
      # - env -u GOROOT -u GOTOOLDIR go test ./... -bench=. | grep -E '^(=== RUN|PASS|FAIL|Benchmark|ok)'

  tidy:
    desc: Run go mod tidy for examples/generics module
    cmds:
      - env -u GOROOT -u GOTOOLDIR go mod tidy

  update:
    desc: Update examples/generics module dependencies
    cmds:
      - env -u GOROOT -u GOTOOLDIR go get -u -v ./...
      - task: tidy
