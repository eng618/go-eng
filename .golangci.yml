version: "2"
run:
  go: "1.27"
  modules-download-mode: readonly
  allow-parallel-runners: false
  timeout: 5m
  relative-path-mode: gomod

output:
  formats:
    text:
      path: stdout
    json:
      path: ./linter-output.json
  path-mode: abs

linters:
  default: standard
  enable:
    - asciicheck
    - bidichk
    - copyloopvar
    - cyclop
    - decorder
    - errorlint
    - godoclint
    - godot
    - gosec
    - importas
    - intrange
    - lll
    - misspell
    - modernize
    - perfsprint
    - revive
    - testableexamples
    - testpackage
    - thelper
    - usestdlibvars
    - whitespace
  settings:
    lll:
      line-length: 120
    misspell:
      locale: US
    testpackage:
      # White-box tests (unexported internals) live in *_internal_test.go.
      skip-regexp: _internal_test\.go$

issues:
  # Disable filter and show all errors defaults to 3
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gci
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/eng618/go-eng)
      custom-order: true
    gofumpt:
      module-path: github.com/eng618/go-eng
      extra:
        group-params: true
        clothe-returns: true
        balance-calls: true
    goimports:
      local-prefixes:
        - github.com/eng618/go-eng
