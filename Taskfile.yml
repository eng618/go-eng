version: "3"

env:
  GOTOOLCHAIN: local

includes:
  root:
    taskfile: ./Taskfile.root.yml
    dir: .
  circuit-breaker:
    taskfile: ./design-patterns/circuit-breaker/Taskfile.yml
    dir: ./design-patterns/circuit-breaker
  master-slave:
    taskfile: ./design-patterns/master-slave/Taskfile.yml
    dir: ./design-patterns/master-slave
  contexts:
    taskfile: ./examples/contexts/Taskfile.yml
    dir: ./examples/contexts
  generics:
    taskfile: ./examples/generics/Taskfile.yml
    dir: ./examples/generics
  rate-limiting:
    taskfile: ./examples/rate-limiting/Taskfile.yml
    dir: ./examples/rate-limiting
  web-service-gin:
    taskfile: ./examples/web-service-gin/Taskfile.yml
    dir: ./examples/web-service-gin

tasks:
  build:
    desc: Build the project
    cmds:
      - task: root:build
      - task: circuit-breaker:build
      - task: master-slave:build
      - task: contexts:build
      - task: generics:build
      - task: rate-limiting:build
      - task: web-service-gin:build

  lint:
    desc: Run linter for all modules
    cmds:
      - task: root:lint
      - task: circuit-breaker:lint
      - task: master-slave:lint
      - task: contexts:lint
      - task: generics:lint
      - task: rate-limiting:lint
      - task: web-service-gin:lint

  lint-fix:
    desc: Fix linting issues for all modules
    cmds:
      - task: root:lint-fix
      - task: circuit-breaker:lint-fix
      - task: master-slave:lint-fix
      - task: contexts:lint-fix
      - task: generics:lint-fix
      - task: rate-limiting:lint-fix
      - task: web-service-gin:lint-fix

  test:
    desc: Run tests with race detection
    cmds:
      - task: root:test
      - task: circuit-breaker:test
      - task: master-slave:test
      - task: contexts:test
      - task: generics:test
      - task: rate-limiting:test
      - task: web-service-gin:test

  bench:
    desc: Run benchmarks
    cmds:
      - task: root:bench
      - task: circuit-breaker:bench
      - task: master-slave:bench
      - task: contexts:bench
      - task: generics:bench
      - task: rate-limiting:bench
      - task: web-service-gin:bench

  validate:
    desc: Run lint, test, and build
    cmds:
      - task: lint
      - task: test
      # - task: bench
      - task: build

  # -----------------------------------------------------------------------------
  # Release management
  # -----------------------------------------------------------------------------

  publish:
    desc: Dry-run a release locally (skips publish)
    deps: [release]

  release:
    desc: Create a release
    cmds:
      - env -u GOROOT -u GOTOOLDIR goreleaser release --clean --skip=publish

  # -----------------------------------------------------------------------------
  # Dependency management
  # -----------------------------------------------------------------------------

  tidy:
    desc: Run go mod tidy
    deps:
      [
        root:tidy,
        circuit-breaker:tidy,
        contexts:tidy,
        generics:tidy,
        master-slave:tidy,
        rate-limiting:tidy,
        web-service-gin:tidy,
      ]

  deps-list:
    desc: List all dependencies
    cmds:
      - env -u GOROOT -u GOTOOLDIR go list -m -u -mod=readonly all

  deps-upgrade:
    desc: Upgrade project dependencies
    deps:
      [
        root:update,
        contexts:update,
        generics:update,
        rate-limiting:update,
        web-service-gin:update,
        circuit-breaker:update,
        master-slave:update,
      ]
    cmds:
      - env -u GOROOT -u GOTOOLDIR go get -u -v ./...
      - env -u GOROOT -u GOTOOLDIR go mod tidy

  deps-reset:
    desc: Reset dependencies
    cmds:
      - git checkout -- go.mod
      - env -u GOROOT -u GOTOOLDIR go mod tidy

  deps-cleancache:
    desc: Clean Go mod cache
    cmds:
      - env -u GOROOT -u GOTOOLDIR go clean -modcache

  list:
    desc: List all Go modules
    cmds:
      - env -u GOROOT -u GOTOOLDIR go list -mod=mod all
